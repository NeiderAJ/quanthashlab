name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install

      # --- ¡NUEVO PASO! ---
      - name: Create Firebase config file
        run: |
          echo "import { initializeApp } from 'firebase/app';" > src/firebase/config.js
          echo "import { getAuth } from 'firebase/auth';" >> src/firebase/config.js
          echo "import { getFirestore } from 'firebase/firestore';" >> src/firebase/config.js
          echo "const firebaseConfig = ${{ secrets.VITE_FIREBASE_CONFIG }};" >> src/firebase/config.js
          echo "const app = initializeApp(firebaseConfig);" >> src/firebase/config.js
          echo "export const auth = getAuth(app);" >> src/firebase/config.js
          echo "export const db = getFirestore(app);" >> src/firebase/config.js
      
      - name: Build
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4